name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 省略 version，让 action 读取 package.json 的 packageManager，与 lockfile 同一份钉扎
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Biome 不需要原生模块；跳过 postinstall（electron / better-sqlite3 rebuild）
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Biome check
        run: pnpm check
